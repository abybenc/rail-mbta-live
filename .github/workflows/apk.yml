name: Build MBTA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/apk.yml", "android-src/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/abybenc/mbta android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/res/mipmap-xxhdpi
          cp icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp icon-192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MBTA"
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.abybenc.mbta'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.abybenc.mbta'
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName '1.2'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cp android-src/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android-src/*.java android/app/src/main/java/com/abybenc/mbta/

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Name it MBTA.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MBTA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MBTA-apk
          path: MBTA.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: MBTA app v1.${{ github.run_number }}
          body: Download MBTA.apk on your Android phone and open it to install.
          files: MBTA.apk
          make_latest: true
